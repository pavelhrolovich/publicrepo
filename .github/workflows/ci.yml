name: Java Showcase CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - carpet-slicing
          - carpetslisingtask
          - prefixsearcher
          - p2ploancalculator
          - orderboard-app
          - ec2-dashboard-service

    name: ${{ matrix.project }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Temurin 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn -B -f "${{ matrix.project }}/pom.xml" test
